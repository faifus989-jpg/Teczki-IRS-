<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Casino Slots – test page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Bungee&family=Bungee+Shade&family=Cinzel+Decorative:wght@900&family=Monoton&family=Pacifico&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
/* casino_slots UI
   Colors come from each machine's "colors" in games.lua (app.js turns them into --primary, --secondary...).
   Shades like --primary-a30 (30% alpha), --primary-w40 (40% towards white), --primary-k45 (45% towards black) are pre-mixed by app.js. */

:root {
    --w: min(96vw, 1180px, 150vh);
    --u: calc(var(--w) / 150);
    --primary: #f5b72d; --secondary: #3fd0c9; --body: #0b1726; --reel: #10233a; --ink: #f8ecd0;
    --ui: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
    --display: 'Bungee', Impact, 'Arial Black', sans-serif;
    --logo-font: var(--display);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: var(--ui); user-select: none; }
#app { position: fixed; inset: 0; display: grid; place-items: center; }
#app[hidden] { display: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: calc(var(--u) * 0.4) solid var(--secondary); outline-offset: 2px; }
button:disabled { cursor: default; }
svg { display: block; }

/* =========================================================
   Machine shell
   ========================================================= */

.machine {
    position: relative;
    width: var(--w);
    height: calc(var(--u) * 96);
    display: grid;
    grid-template-columns: calc(var(--u) * 22) 1fr calc(var(--u) * 22);
    grid-template-rows: calc(var(--u) * 15) 1fr calc(var(--u) * 11);
    grid-template-areas: "top top top" "left stage right" "bottom bottom bottom";
    gap: calc(var(--u) * 1.4) calc(var(--u) * 1.8);
    padding: calc(var(--u) * 1.6) calc(var(--u) * 2.2) calc(var(--u) * 2);
    border-radius: calc(var(--u) * 4);
    color: var(--ink);
    background: var(--body);
    box-shadow:
        0 0 0 calc(var(--u) * 0.35) var(--primary-k45),
        0 0 0 calc(var(--u) * 0.7) rgba(0, 0, 0, 0.6),
        0 0 calc(var(--u) * 8) var(--primary-a30),
        0 calc(var(--u) * 3) calc(var(--u) * 10) rgba(0, 0, 0, 0.75);
    overflow: hidden;
    isolation: isolate;
    animation: machine-in 450ms cubic-bezier(.2, .9, .3, 1.12);
}
@keyframes machine-in { from { transform: translateY(calc(var(--u) * 5)) scale(0.95); opacity: 0; } }
.machine.shake { animation: shake 480ms cubic-bezier(.36, .07, .19, .97) 2; }
@keyframes shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(3px, -1px); }
    30%, 50%, 70% { transform: translate(-6px, 2px); }
    40%, 60% { transform: translate(6px, -2px); }
}

/* animated light show behind everything */
.backdrop { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.backdrop .glow {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(60% 50% at 50% 0%, var(--primary-a35), transparent 70%),
        radial-gradient(50% 45% at 50% 105%, var(--secondary-a25), transparent 70%),
        linear-gradient(180deg, var(--body-w10), var(--body) 35%, var(--body-k45));
}
.backdrop .beams {
    position: absolute;
    left: 50%;
    top: -60%;
    width: 220%;
    aspect-ratio: 1;
    margin-left: -110%;
    background: repeating-conic-gradient(from 0deg, var(--primary-a10) 0 5deg, transparent 5deg 15deg);
    animation: beams 40s linear infinite;
    -webkit-mask: radial-gradient(circle, #000 0, transparent 55%);
    mask: radial-gradient(circle, #000 0, transparent 55%);
}
.machine.celebrating .backdrop .beams, .machine.free-mode .backdrop .beams { animation-duration: 8s; }
@keyframes beams { to { transform: rotate(360deg); } }

/* =========================================================
   Header
   ========================================================= */

.top {
    grid-area: top;
    position: relative;
    display: grid;
    grid-template-columns: calc(var(--u) * 30) 1fr calc(var(--u) * 30);
    align-items: center;
}

.logo-wrap { display: grid; place-items: center; min-width: 0; }
.logo {
    font-family: var(--logo-font);
    font-weight: 400;
    font-size: calc(var(--u) * 8.4);
    line-height: 1.1;
    white-space: nowrap;
    background: linear-gradient(180deg, #ffffff 8%, var(--primary-w50) 38%, var(--primary) 55%, var(--primary-w20) 72%, var(--primary-k30));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    /* stacked shadows = a 3D extruded sign */
    filter:
        drop-shadow(0 1px 0 var(--primary-k55)) drop-shadow(0 1px 0 var(--primary-k55))
        drop-shadow(0 1px 0 var(--primary-k70)) drop-shadow(0 1px 0 var(--primary-k70))
        drop-shadow(0 calc(var(--u) * 0.8) calc(var(--u) * 1) rgba(0, 0, 0, 0.6))
        drop-shadow(0 0 calc(var(--u) * 3) var(--primary-a40));
    animation: logo-breathe 3.5s ease-in-out infinite;
    padding: 0 calc(var(--u) * 1);
}
@keyframes logo-breathe { 50% { transform: scale(1.025); } }

.level { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
.level[hidden] { display: none; }
.level-badge {
    display: grid;
    place-items: center;
    width: calc(var(--u) * 7);
    height: calc(var(--u) * 7);
    font-family: var(--display);
    font-size: calc(var(--u) * 2.8);
    color: #fff;
    background: radial-gradient(circle at 35% 30%, var(--secondary-w50), var(--secondary) 50%, var(--secondary-k55));
    clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
}
.level-info { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }
.level-label { font-size: calc(var(--u) * 1.9); font-weight: 700; color: var(--ink-a70); }
.level-bar { display: block; width: calc(var(--u) * 18); height: calc(var(--u) * 1.3); border-radius: calc(var(--u) * 1); background: rgba(0, 0, 0, 0.5); overflow: hidden; box-shadow: inset 0 0 0 1px var(--ink-a15); }
.level-fill { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--secondary), #fff); box-shadow: 0 0 calc(var(--u) * 1.2) var(--secondary); transition: width 700ms cubic-bezier(.3, 1.4, .5, 1); }
.level.up .level-badge { animation: pop-big 400ms ease-out 3; }

.jackpot {
    justify-self: end;
    margin-right: calc(var(--u) * 6);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: calc(var(--u) * 0.7) calc(var(--u) * 2.2) calc(var(--u) * 0.9);
    border-radius: calc(var(--u) * 1.6);
    background: linear-gradient(180deg, #1c0a03, #070200);
    box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--primary-k30), 0 0 calc(var(--u) * 3) var(--primary-a30), inset 0 0 calc(var(--u) * 2) #000;
}
.jackpot-label { font-size: calc(var(--u) * 1.7); font-weight: 800; color: var(--primary-w40); }
.jackpot-value {
    font-family: var(--display);
    font-size: calc(var(--u) * 3.6);
    line-height: 1.05;
    color: #ffc23d;
    text-shadow: 0 0 calc(var(--u) * 0.5) #ffb52e, 0 0 calc(var(--u) * 2) rgba(255, 170, 40, 0.7);
    font-variant-numeric: tabular-nums;
}
.jackpot-value.bump { animation: pop-big 450ms ease-out; }

.close {
    position: absolute;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
    width: calc(var(--u) * 4.6);
    height: calc(var(--u) * 4.6);
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.45);
    color: #fff;
    display: grid;
    place-items: center;
}
.close svg { width: 55%; }
.close:hover { background: rgba(0, 0, 0, 0.7); }

/* =========================================================
   Reel stage
   ========================================================= */

.stage { grid-area: stage; display: grid; min-height: 0; position: relative; }

.frame {
    position: relative;
    padding: calc(var(--u) * 0.9);
    border-radius: calc(var(--u) * 2.6);
    overflow: hidden;
    box-shadow: 0 0 calc(var(--u) * 4) var(--primary-a40), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 0, 0.7);
}
/* rotating rainbow of the machine's colors around the reels */
.frame-lights {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 160%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, var(--primary), var(--secondary), #fff, var(--primary), var(--secondary), var(--primary-w50), var(--primary));
    animation: frame-spin 6s linear infinite;
}
.machine.spinning .frame-lights { animation-duration: 1.4s; }
.machine.celebrating .frame-lights, .machine.winning .frame-lights { animation-duration: 0.9s; }
@keyframes frame-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

.window {
    position: relative;
    height: 100%;
    border-radius: calc(var(--u) * 1.8);
    overflow: hidden;
    background: #000;
}
.window::after { /* glass */
    content: '';
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent 14%, transparent 86%, rgba(0, 0, 0, 0.55)),
        linear-gradient(115deg, rgba(255, 255, 255, 0.09), transparent 32%);
}

.reels {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: calc(var(--u) * 0.4);
    height: 100%;
    background: #000;
}
.reel {
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(120% 70% at 50% 50%, var(--reel-w8), var(--reel) 60%, var(--reel-k35));
}
.reel.tease { animation: tease 400ms ease-in-out infinite alternate; z-index: 1; }
@keyframes tease { to { box-shadow: inset 0 0 0 calc(var(--u) * 0.5) var(--secondary), inset 0 0 calc(var(--u) * 6) var(--secondary); } }
.window.anticipate .reel:not(.tease) { filter: brightness(0.45); transition: filter 300ms; }

.strip { position: absolute; inset: 0 0 auto 0; will-change: transform; }

.cell { position: relative; display: grid; place-items: center; transition: opacity 250ms, filter 250ms; }
.cell .art { width: var(--art); height: var(--art); display: grid; place-items: center; filter: drop-shadow(0 calc(var(--u) * 0.5) calc(var(--u) * 0.5) rgba(0, 0, 0, 0.5)); }
.cell .art svg, .cell .art img { width: 100%; height: 100%; object-fit: contain; }
.reel.moving .cell .art { filter: blur(calc(var(--u) * 0.35)); transform: scaleY(1.12); }
.cell .badge {
    position: absolute;
    right: 8%;
    bottom: 10%;
    font-family: var(--display);
    font-size: calc(var(--art) * 0.2);
    padding: 0.15em 0.4em 0.05em;
    border-radius: 0.4em;
    background: var(--primary);
    color: #fff;
    box-shadow: 0 0 calc(var(--u) * 1.2) var(--primary);
    transform: rotate(8deg);
    border: 2px solid #fff;
}
.cell.sym-scatter .art { animation: scatter-pulse 1.3s ease-in-out infinite; filter: drop-shadow(0 0 calc(var(--u) * 1.2) var(--primary)); }
@keyframes scatter-pulse { 50% { transform: scale(1.08) rotate(-3deg); } }
.cell.land .art { animation: land 300ms cubic-bezier(.3, 1.9, .5, 1); }
@keyframes land { 40% { transform: scale(1.3); filter: brightness(1.8) drop-shadow(0 0 20px #fff); } }

/* wins */
.window.has-win .cell { opacity: 0.25; filter: saturate(0.3) brightness(0.8); }
.window.has-win .cell.hit { opacity: 1; filter: none; z-index: 2; }
.cell.hit::before {
    content: '';
    position: absolute;
    inset: 5%;
    border-radius: 18%;
    background: radial-gradient(circle, var(--hit-a50, var(--primary-a50)), transparent 70%);
    box-shadow: 0 0 0 calc(var(--u) * 0.35) var(--hit, var(--primary)), 0 0 calc(var(--u) * 2.5) var(--hit, var(--primary)), inset 0 0 calc(var(--u) * 2) var(--hit, var(--primary));
    animation: frame-in 280ms ease-out;
}
.cell.hit .art { animation: hit-bounce 650ms cubic-bezier(.3, 1.6, .5, 1) infinite alternate; filter: drop-shadow(0 0 calc(var(--u) * 1.2) var(--hit, var(--primary))) drop-shadow(0 calc(var(--u) * 0.4) calc(var(--u) * 0.4) rgba(0, 0, 0, 0.5)); }
@keyframes hit-bounce { from { transform: scale(1.14); } to { transform: scale(0.98); } }
@keyframes frame-in { from { transform: scale(1.4); opacity: 0; } }
.cell.pop .art, .cell.pop::before { animation: pop-out 330ms ease-in forwards; }
@keyframes pop-out { 40% { transform: scale(1.45); filter: brightness(2.5); } to { transform: scale(0); opacity: 0; } }

/* paylines: glowing strokes, drawn in, with a spark running along them */
.paylines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
.paylines .pl-glow { fill: none; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; filter: blur(6px); }
.paylines .pl-core { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.paylines .pl-hot { fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
.paylines .draw { animation: draw 450ms ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.paylines .node { stroke: #fff; stroke-width: 3; }
.paylines .node-ring { fill: none; stroke-width: 3; animation: node-ring 1s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes node-ring { from { transform: scale(0.6); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
.paylines .spark { fill: #fff; }
.paylines g.dim { opacity: 0.12; transition: opacity 200ms; }

.tags { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.tag {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: calc(var(--u) * 0.5) calc(var(--u) * 1.4) calc(var(--u) * 0.3);
    border-radius: calc(var(--u) * 1.4);
    font-family: var(--display);
    font-size: calc(var(--u) * 2.2);
    color: #fff;
    background: var(--tag, var(--primary));
    border: 2px solid #fff;
    box-shadow: 0 0 calc(var(--u) * 2) var(--tag, var(--primary)), 0 calc(var(--u) * 0.4) 0 rgba(0, 0, 0, 0.4);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
    white-space: nowrap;
    animation: tag-in 380ms cubic-bezier(.2, 1.8, .4, 1);
}
@keyframes tag-in { from { transform: translate(-50%, -50%) scale(0); } }

/* the win banner replaces a separate win meter */
.win-banner {
    position: absolute;
    left: 50%;
    bottom: calc(var(--u) * -3.2);
    z-index: 6;
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 1.4);
    padding: calc(var(--u) * 1) calc(var(--u) * 4) calc(var(--u) * 0.8);
    border-radius: calc(var(--u) * 3);
    background: linear-gradient(180deg, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.65));
    box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--primary), 0 0 calc(var(--u) * 4) var(--primary-a60);
    transform: translateX(-50%);
    animation: banner-in 420ms cubic-bezier(.2, 1.7, .4, 1);
    pointer-events: none;
}
.win-banner[hidden] { display: none; }
@keyframes banner-in { from { transform: translateX(-50%) translateY(150%) scale(0.6); opacity: 0; } }
.win-label { font-family: var(--display); font-size: calc(var(--u) * 2.4); color: var(--primary-w40); }
.win-amount {
    font-family: var(--display);
    font-size: calc(var(--u) * 4.8);
    line-height: 1;
    background: linear-gradient(180deg, #fff 20%, #ffe27a 50%, #f5a623);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 calc(var(--u) * 0.3) 0 #6b3d00) drop-shadow(0 0 calc(var(--u) * 1.5) rgba(255, 200, 60, 0.7));
    font-variant-numeric: tabular-nums;
}
.win-banner.bump .win-amount { animation: pop-big 300ms ease-out; }

/* =========================================================
   Side columns
   ========================================================= */

.side { display: flex; flex-direction: column; align-items: stretch; gap: calc(var(--u) * 1.6); min-height: 0; }
.side.left { grid-area: left; justify-content: center; }
.side.right { grid-area: right; justify-content: center; align-items: center; }

.buy-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: calc(var(--u) * 0.6);
    padding: calc(var(--u) * 1.8) calc(var(--u) * 1) calc(var(--u) * 1.6);
    border-radius: calc(var(--u) * 2.2);
    background: linear-gradient(165deg, var(--primary-w20), var(--primary) 40%, var(--primary-k55));
    box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--primary-w50), 0 0 calc(var(--u) * 3) var(--primary-a50), 0 calc(var(--u) * 0.8) 0 var(--primary-k70);
    color: #fff;
    overflow: hidden;
    transition: transform 120ms, filter 200ms;
}
.buy-card::after { /* moving shine */
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.45) 45%, transparent 60%) -150% 0 / 250% 100% no-repeat;
    animation: card-shine 3s ease-in-out infinite;
}
@keyframes card-shine { 60%, 100% { background-position: 150% 0; } }
.buy-card:not(:disabled):hover { transform: translateY(calc(var(--u) * -0.4)) scale(1.03); filter: brightness(1.08); }
.buy-card:not(:disabled):active { transform: translateY(calc(var(--u) * 0.4)); }
.buy-card:disabled { filter: grayscale(0.8) brightness(0.6); }
.buy-card[hidden] { display: none; }
.buy-icon { width: calc(var(--u) * 10); height: calc(var(--u) * 10); animation: float 2.4s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(calc(var(--u) * -0.8)) rotate(4deg); } }
.buy-title { font-family: var(--display); font-size: calc(var(--u) * 2.3); line-height: 1.05; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.35); }
.buy-price { font-size: calc(var(--u) * 2.6); font-weight: 800; padding: calc(var(--u) * 0.3) calc(var(--u) * 1.6); border-radius: calc(var(--u) * 1.4); background: rgba(0, 0, 0, 0.4); }

.free-card {
    display: grid;
    justify-items: center;
    padding: calc(var(--u) * 1.6) calc(var(--u) * 1);
    border-radius: calc(var(--u) * 2.2);
    background: linear-gradient(165deg, var(--secondary-w20), var(--secondary) 40%, var(--secondary-k55));
    box-shadow: 0 0 0 calc(var(--u) * 0.3) var(--secondary-w50), 0 0 calc(var(--u) * 4) var(--secondary-a60);
    color: #fff;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
    animation: pop-big 400ms ease-out;
}
.free-card[hidden] { display: none; }
.free-title { font-family: var(--display); font-size: calc(var(--u) * 2.2); }
.free-count { font-family: var(--display); font-size: calc(var(--u) * 8); line-height: 1; }
.free-left { font-size: calc(var(--u) * 2); font-weight: 700; margin-top: calc(var(--u) * -0.4); }
.free-mult { font-family: var(--display); font-size: calc(var(--u) * 3); margin: calc(var(--u) * 0.6) 0; padding: 0 calc(var(--u) * 1.4); border-radius: calc(var(--u) * 1.2); background: rgba(0, 0, 0, 0.35); }
.free-total-label { font-size: calc(var(--u) * 1.8); font-weight: 700; opacity: 0.85; }
.free-total { font-family: var(--display); font-size: calc(var(--u) * 2.8); }

.ladder { display: grid; grid-template-columns: repeat(2, 1fr); gap: calc(var(--u) * 0.8); }
.ladder[hidden] { display: none; }
.ladder span {
    display: grid;
    place-items: center;
    height: calc(var(--u) * 5);
    border-radius: calc(var(--u) * 1.3);
    background: rgba(0, 0, 0, 0.45);
    box-shadow: inset 0 0 0 1px var(--ink-a15);
    font-family: var(--display);
    font-size: calc(var(--u) * 2.4);
    color: var(--ink-a50);
    transition: all 200ms;
}
.ladder span.on { background: var(--primary); color: #fff; box-shadow: 0 0 calc(var(--u) * 2.5) var(--primary); transform: scale(1.08); }

.streak {
    text-align: center;
    padding: calc(var(--u) * 0.8);
    border-radius: calc(var(--u) * 1.4);
    background: linear-gradient(180deg, #ffb03a, #ff4d1f);
    color: #fff;
    font-family: var(--display);
    font-size: calc(var(--u) * 2.1);
    box-shadow: 0 0 calc(var(--u) * 2) rgba(255, 90, 30, 0.7);
    animation: pop-big 350ms ease-out, streak-glow 900ms ease-in-out infinite alternate;
}
.streak[hidden] { display: none; }
@keyframes streak-glow { to { box-shadow: 0 0 calc(var(--u) * 4) rgba(255, 140, 30, 0.95); } }

/* spin button */
.spin {
    position: relative;
    width: calc(var(--u) * 17);
    height: calc(var(--u) * 17);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    background: radial-gradient(circle at 50% 28%, var(--primary-w60), var(--primary) 45%, var(--primary-k55));
    box-shadow:
        0 0 0 calc(var(--u) * 0.6) var(--primary-k60),
        0 0 0 calc(var(--u) * 1.1) var(--primary-w30),

    const resource = inGame ? GetParentResourceName() : 'casino_slots';
    // Lua sends empty tables as {} instead of [], so always go through this
    const arr = (x) => (Array.isArray(x) ? x : x && typeof x === 'object' ? Object.values(x) : []);

    const el = {
        app: $('app'), machine: $('machine'), title: $('title'), jackpot: $('jackpot'),
        frame: $('frame'), window: $('window'), reels: $('reels'), paylines: $('paylines'), tags: $('tags'),
        winBanner: $('winBanner'), winLabel: $('winLabel'), winAmount: $('winAmount'),
        message: $('message'), ladder: $('ladder'), streak: $('streak'),
        balance: $('balance'), bet: $('bet'), betDown: $('betDown'), betUp: $('betUp'),
        spinBtn: $('spinBtn'), spinText: $('spinText'), autoBtn: $('autoBtn'), autoLabel: $('autoLabel'), autoMenu: $('autoMenu'),
        turboBtn: $('turboBtn'), muteBtn: $('muteBtn'), paytableBtn: $('paytableBtn'),
        bonusBtn: $('bonusBtn'), buyIcon: $('buyIcon'), buyPrice: $('buyPrice'),
        freeCard: $('freeCard'), freeCount: $('freeCount'), freeMult: $('freeMult'), freeTotal: $('freeTotal'),
        level: $('level'), levelBadge: $('levelBadge'), levelFill: $('levelFill'),
        celebrate: $('celebrate'), celebrateTitle: $('celebrateTitle'), celebrateAmount: $('celebrateAmount'), celebrateNote: $('celebrateNote'),
        paytable: $('paytable'), paytableGrid: $('paytableGrid'), paytableSub: $('paytableSub'), rules: $('rules'),
        confirm: $('confirm'), confirmIcon: $('confirmIcon'), confirmTitle: $('confirmTitle'), confirmText: $('confirmText'), confirmYes: $('confirmYes'),
        flash: $('flash'), fx: $('fx'),
    };

    const state = {
        game: null, symbols: {}, art: {}, betIndex: 0, balance: 0, jackpot: 0,
        spinning: false, auto: 0, turbo: false, muted: false, free: null, grid: null,
        open: false, streak: 0, idleTimer: null, cycleTimer: null,
    };

    const LINE_COLORS = ['#ffd23f', '#22e6ff', '#ff4fa3', '#3fe08a', '#ff8a3d', '#b679ff', '#ff5a5a', '#7df9ff', '#c6ff4d', '#ffffff'];

    const money = (n) => '$' + Math.floor(n).toLocaleString('en-US');
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const fast = (normal, turbo) => (state.turbo ? turbo : normal);
    const currentBet = () => (state.free ? state.free.bet : state.game.betLevels[state.betIndex]);

    async function post(name, body = {}) {
        if (!inGame) return window.SlotPreview ? window.SlotPreview[name](body) : {};
        const res = await fetch(`https://${resource}/${name}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json; charset=UTF-8' },
            body: JSON.stringify(body),
        });
        return res.json();
    }

    // =========================================================
    // Theme: turn the 5 machine colors into all the shades the CSS uses
    // =========================================================

    const hexToRgb = (hex) => { const h = (hex || '#888888').replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); };
    function shade(hex, kind, pct) {
        const c = hexToRgb(hex), t = pct / 100;
        if (kind === 'a') return `rgba(${c.join(',')},${t})`;
        const target = kind === 'w' ? 255 : 0;
        return `rgb(${c.map((v) => Math.round(v + (target - v) * t)).join(',')})`;
    }
    const STEPS = { a: [8, 10, 15, 20, 25, 30, 35, 40, 50, 60, 70, 85], w: [8, 10, 20, 30, 40, 50, 60], k: [15, 30, 35, 45, 55, 60, 70, 75] };

    function applyTheme(game) {
        const t = game.theme || {};
        const base = { primary: t.primary, secondary: t.secondary, body: t.background, reel: t.reelBg, ink: t.ink };
        const s = el.machine.style;
        for (const [key, hex] of Object.entries(base)) {
            s.setProperty(`--${key}`, hex);
            for (const [kind, list] of Object.entries(STEPS)) list.forEach((n) => s.setProperty(`--${key}-${kind}${n}`, shade(hex, kind, n)));
        }
        el.machine.className = `machine style-${game.style || 'gold'}`;
    }

    // =========================================================
    // Symbols + reels
    // =========================================================

    function symbolCell(id, h) {
        const sym = state.symbols[id] || { name: '?' };
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (h) cell.style.height = `${h}px`;
        if (sym.scatter) cell.classList.add('sym-scatter');
        if (sym.wild) cell.classList.add('sym-wild');
        cell.innerHTML = `<div class="art">${state.art[id] || ''}</div>${sym.badge ? `<span class="badge">${sym.badge}</span>` : ''}`;
        return cell;
    }

    const symbolIds = () => Object.keys(state.symbols);
    const randomSymbol = () => { const ids = symbolIds(); return ids[Math.floor(Math.random() * ids.length)]; };
    const cellHeight = () => el.window.clientHeight / state.game.rows;

    function buildReels(grid) {
        const g = state.game;
        const plain = symbolIds().filter((id) => !state.symbols[id].scatter && !state.symbols[id].wild);
        const calm = () => plain[Math.floor(Math.random() * plain.length)];
        state.grid = grid || Array.from({ length: g.reels }, () => Array.from({ length: g.rows }, calm));

        el.reels.innerHTML = '';
        const h = cellHeight();
        const w = el.window.clientWidth / g.reels;
        el.reels.style.setProperty('--art', `${Math.min(h, w) * 0.8}px`);
        state.grid.forEach((col) => {
            const reel = document.createElement('div');
            reel.className = 'reel';
            const strip = document.createElement('div');
            strip.className = 'strip';
            col.forEach((id) => strip.appendChild(symbolCell(id, h)));
            reel.appendChild(strip);
            el.reels.appendChild(reel);
        });
    }

    function animateReels(grid) {
        const g = state.game;
        const h = cellHeight();
        let scattersSoFar = 0, extra = 0, landed = 0;
        Sound.spinLoop();

        const jobs = [...el.reels.children].map((reel, i) => {
            const strip = reel.firstChild;
            const fillers = fast(10 + i * 3, 4 + i * 2);
            const tease = g.scatter && scattersSoFar >= 2;
            const baseStop = fast(650 + i * 210, 260 + i * 80) + extra;
            if (tease) {
                const len = fast(1100, 380);
                extra += len;
                setTimeout(() => { el.window.classList.add('anticipate'); reel.classList.add('tease'); Sound.riser(len / 1000); }, baseStop - 120);
            }
            scattersSoFar += grid[i].filter((s) => s === g.scatter).length;

            const old = state.grid[i];
            strip.innerHTML = '';
            grid[i].forEach((id) => strip.appendChild(symbolCell(id, h)));
            for (let f = 0; f < fillers; f++) strip.appendChild(symbolCell(randomSymbol(), h));
            old.forEach((id) => strip.appendChild(symbolCell(id, h)));

            strip.style.transition = 'none';
            strip.style.transform = `translateY(${-(fillers + g.rows) * h}px)`;
            strip.getBoundingClientRect();
            const duration = fast(650 + i * 210, 260 + i * 80) + extra;
            reel.classList.add('moving');
            strip.style.transition = `transform ${duration}ms cubic-bezier(.22,.62,.28,1.08)`;
            strip.style.transform = 'translateY(0)';

            return new Promise((resolve) => setTimeout(() => {
                reel.classList.remove('moving', 'tease');
                while (strip.children.length > g.rows) strip.removeChild(strip.lastChild);
                strip.style.transition = 'none';
                Sound.reelStop(i);
                const sc = grid[i].filter((s) => s === g.scatter).length;
                if (sc) {
                    landed += sc;
                    Sound.scatter(landed);
                    [...strip.children].forEach((c, row) => { if (grid[i][row] === g.scatter) c.classList.add('land'); });
                }
                if (i === g.reels - 1) { el.window.classList.remove('anticipate'); Sound.spinStop(); }
                resolve();
            }, duration));
        });
        state.grid = grid;
        return Promise.all(jobs);
    }

    function collapseTo(removed, next) {
        const g = state.game;
        const h = cellHeight();
        const gone = new Set(removed.map(([r, row]) => `${r}:${row}`));
        const dur = fast(420, 220);
        [...el.reels.children].forEach((reel, i) => {
            const strip = reel.firstChild;
            const oldRows = [];
            for (let row = 1; row <= g.rows; row++) if (!gone.has(`${i + 1}:${row}`)) oldRows.push(row);
            const missing = g.rows - oldRows.length;
            strip.innerHTML = '';
            next[i].forEach((id, idx) => {
                const c = symbolCell(id, h);
                const from = idx < missing ? -missing * h : (oldRows[idx - missing] - (idx + 1)) * h;
                c.style.transform = `translateY(${from}px)`;
                strip.appendChild(c);
            });
            strip.getBoundingClientRect();
            [...strip.children].forEach((c, idx) => {
                c.style.transition = `transform ${dur}ms cubic-bezier(.5,0,.7,1.25) ${(g.rows - idx) * 25 + i * 30}ms`;
                c.style.transform = 'translateY(0)';
            });
        });
        state.grid = next;
        setTimeout(() => Sound.thud(), dur);
        return sleep(dur + g.rows * 25 + g.reels * 30 + 60);
    }

    const cellAt = (reel, row) => el.reels.children[reel - 1]?.firstChild.children[row - 1];

    function cellCenter(reel, row) {
        const r = el.reels.children[reel - 1];
        if (!r) return [0, 0];
        return [r.offsetLeft + r.offsetWidth / 2, (row - 0.5) * cellHeight()];
    }

    // =========================================================
    // Win presentation: glowing lines, sparks, nodes, value tags
    // =========================================================

    function clearWins() {
        clearInterval(state.cycleTimer);
        state.cycleTimer = null;
        el.window.classList.remove('has-win');
        el.machine.classList.remove('winning');
        el.reels.querySelectorAll('.hit, .pop').forEach((c) => { c.classList.remove('hit', 'pop'); c.style.removeProperty('--hit'); });
        el.paylines.innerHTML = '';
        el.tags.innerHTML = '';
    }

    function hideBanner() { el.winBanner.hidden = true; }

    function svgEl(tag, attrs) {
        const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        return n;
    }

    function linePoints(win) {
        const g = state.game;
        if (win.line && g.lines) return g.lines[win.line - 1].map((row, i) => cellCenter(i + 1, row));
        // ways: run through the first winning cell of each reel
        const byReel = {};
        arr(win.positions).forEach(([r, row]) => { if (!byReel[r]) byReel[r] = row; });
        return Object.keys(byReel).sort((a, b) => a - b).map((r) => cellCenter(+r, byReel[r]));
    }

    function drawLine(win, color) {
        const pts = linePoints(win);
        if (pts.length < 2) return null;
        const d = pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
        const group = svgEl('g', {});
        const glow = svgEl('path', { d, class: 'pl-glow', stroke: color });
        const core = svgEl('path', { d, class: 'pl-core draw', stroke: color });
        const hot = svgEl('path', { d, class: 'pl-hot draw' });
        group.append(glow, core, hot);
        arr(win.positions).forEach(([r, row]) => {
            const [x, y] = cellCenter(r, row);
            group.append(svgEl('circle', { cx: x, cy: y, r: 9, class: 'node-ring', stroke: color }));
            group.append(svgEl('circle', { cx: x, cy: y, r: 6, class: 'node', fill: color }));
        });
        // two sparks racing along the line
        for (const begin of ['0s', '0.45s']) {
            const spark = svgEl('circle', { r: 5, class: 'spark', style: `filter: drop-shadow(0 0 6px ${color}) drop-shadow(0 0 3px #fff)` });
            spark.append(svgEl('animateMotion', { dur: '0.9s', repeatCount: 'indefinite', path: d, begin }));
            group.append(spark);
        }
        el.paylines.append(group);
        const len = core.getTotalLength();
        [core, hot].forEach((p) => { p.style.strokeDasharray = len; p.style.strokeDashoffset = len; });
        return group;
    }

    function tagFor(win, amount, color) {
        const pos = arr(win.positions);
        const [x, y] = cellCenter(...pos[pos.length - 1]);
        const t = document.createElement('div');
        t.className = 'tag';
        t.style.setProperty('--tag', color);
        t.style.left = `${x}px`;
        t.style.top = `${y}px`;
        t.textContent = money(amount);
        el.tags.append(t);
    }

    function highlight(positions, color) {
        positions.forEach(([r, row]) => {
            const c = cellAt(r, row);
            if (!c) return;
            c.classList.add('hit');
            c.style.setProperty('--hit', color);
        });
    }

    function showWins(wins, bet, mult, cycle) {
        if (!wins.length) return;
        const W = el.window.clientWidth, H = el.window.clientHeight;
        el.paylines.setAttribute('viewBox', `0 0 ${W} ${H}`);
        el.window.classList.add('has-win');
        el.machine.classList.add('winning');
        flash(false);
        el.frame.classList.remove('punch'); void el.frame.offsetWidth; el.frame.classList.add('punch');

        const items = wins.map((w, i) => {
            const color = LINE_COLORS[(w.line ? w.line - 1 : i) % LINE_COLORS.length];
            highlight(arr(w.positions), color);
            return { w, color, amount: w.multiplier * bet * mult, group: drawLine(w, color) };
        });
        items.forEach((it, i) => setTimeout(() => Sound.lineHit(i), i * 70));
        if (items.length === 1) tagFor(items[0].w, items[0].amount, items[0].color);

        // then show one line at a time with its prize, like a real machine
        if (cycle && items.length > 1) {
            let i = 0;
            const showOne = () => {
                const it = items[i++ % items.length];
                items.forEach((o) => o.group && o.group.classList.toggle('dim', o !== it));
                el.reels.querySelectorAll('.hit').forEach((c) => c.classList.remove('hit'));
                highlight(arr(it.w.positions), it.color);
                el.tags.innerHTML = '';
                tagFor(it.w, it.amount, it.color);
            };
            state.cycleTimer = setTimeout(() => { showOne(); state.cycleTimer = setInterval(showOne, 1300); }, 1400);
        }
    }

    function burstFrom(positions, strength) {
        const box = el.machine.getBoundingClientRect();
        positions.forEach(([r, row]) => {
            const c = cellAt(r, row);
            if (!c) return;
            const b = c.getBoundingClientRect();
            const x = b.left - box.left + b.width / 2, y = b.top - box.top + b.height / 2;
            FX.burst(x, y, Math.min(16, 4 + Math.floor(strength * 1.5)), strength >= 2 ? 'coin' : 'spark');
            FX.ring(x, y);
        });
        if (strength >= 5) FX.fountain(Math.min(3, strength / 5));
    }

    function showBanner(label, amount, from = 0) {
        el.winLabel.textContent = label;
        const wasHidden = el.winBanner.hidden;
        el.winBanner.hidden = false;
        if (!wasHidden) { el.winBanner.classList.remove('bump'); void el.winBanner.offsetWidth; el.winBanner.classList.add('bump'); }
        return countUp(el.winAmount, from, amount, Math.min(900, 300 + amount / 20));
    }

    // =========================================================
    // Small UI helpers
    // =========================================================

    function setMessage(text, kind = '') {
        el.message.textContent = text;
        el.message.className = 'message' + (kind ? ' ' + kind : '');
    }

    function flash(strong) {
        el.flash.classList.remove('go', 'strong');
        void el.flash.offsetWidth;
        el.flash.classList.add('go');
        if (strong) el.flash.classList.add('strong');
    }

    function shake() { el.machine.classList.remove('shake'); void el.machine.offsetWidth; el.machine.classList.add('shake'); }

    function countUp(node, from, to, ms, onValue) {
        return new Promise((resolve) => {
            const start = performance.now();
            const step = (now) => {
                const t = Math.min(1, (now - start) / ms);
                const v = from + (to - from) * (1 - Math.pow(1 - t, 3));
                node.textContent = money(v);
                if (onValue) onValue(v);
                if (t < 1) requestAnimationFrame(step); else resolve();
            };
            requestAnimationFrame(step);
        });
    }

    function renderLadder(active = -1) {
        const g = state.game;
        if (!g.cascade) { el.ladder.hidden = true; return; }
        const values = arr(state.free ? g.cascade.freeLadder : g.cascade.ladder);
        el.ladder.hidden = false;
        el.ladder.innerHTML = values.map((v, i) => `<span class="${i === active ? 'on' : ''}">×${v}</span>`).join('');
    }

    function renderFree() {
        const f = state.free;
        el.freeCard.hidden = !f;
        el.bonusBtn.hidden = !!f || !state.game.bonusBuy;
        el.machine.classList.toggle('free-mode', !!f);
        if (!f) return;
        el.freeCount.textContent = f.remaining;
        el.freeMult.textContent = `×${f.multiplier}`;
        el.freeTotal.textContent = money(f.total);
    }

    function refresh() {
        const g = state.game;
        const free = !!state.free;
        const lock = free || state.spinning || state.auto > 0;
        el.balance.textContent = money(state.balance);
        el.bet.textContent = money(currentBet());
        el.betDown.disabled = lock || state.betIndex === 0;
        el.betUp.disabled = lock || state.betIndex === g.betLevels.length - 1;
        if (g.bonusBuy) el.buyPrice.textContent = money(currentBet() * g.bonusBuy.cost);
        el.bonusBtn.disabled = lock;
        el.paytableBtn.disabled = state.spinning;
        el.autoBtn.disabled = free;
        el.autoBtn.classList.toggle('active', state.auto > 0);
        el.autoLabel.textContent = state.auto > 0 ? `${state.auto} left` : 'Auto';
        el.spinBtn.classList.toggle('stop', state.auto > 0 && !free);
        el.spinBtn.classList.toggle('free', free);
        el.spinText.textContent = free ? 'Free' : state.auto > 0 ? 'Stop' : '';
        el.spinBtn.disabled = free || (state.spinning && state.auto === 0);
        el.machine.classList.toggle('spinning', state.spinning);
        renderFree();
    }

    // =========================================================
    // Celebrations
    // =========================================================

    function setTier(tier) {
        el.celebrate.classList.remove('tier-big', 'tier-mega', 'tier-epic', 'tier-jackpot');
        if (tier) el.celebrate.classList.add('tier-' + tier);
    }

    function overlay(title, amount, note, opts = {}) {
        el.celebrateTitle.textContent = title;
        el.celebrateAmount.textContent = amount == null ? '' : money(0);
        el.celebrateNote.textContent = note || 'Click to continue';
        setTier(opts.tier);
        el.celebrate.hidden = false;
        el.machine.classList.add('celebrating');
        flash(true);
        if (opts.shake) shake();
        let stopRain = opts.rain ? FX.rain(opts.rain) : () => {};

        const ups = (opts.upgrades || []).slice();
        const onValue = (v) => {
            while (ups.length && v >= ups[0].at) {
                const up = ups.shift();
                el.celebrateTitle.textContent = up.title;
                el.celebrateTitle.classList.remove('reslam'); void el.celebrateTitle.offsetWidth; el.celebrateTitle.classList.add('reslam');
                setTier(up.tier);
                stopRain(); stopRain = FX.rain(up.rain);
                FX.fountain(up.rain);
                flash(true); shake();
                Sound.tierUp(up.tier);
            }
        };
        el.celebrateAmount.classList.toggle('counting', amount != null);
        const duration = opts.duration || Math.min(4500, 1400 + (amount || 0) / 40);
        const counting = amount == null ? Promise.resolve()
            : countUp(el.celebrateAmount, 0, amount, duration, onValue).then(() => { el.celebrateAmount.classList.remove('counting'); Sound.landing(); });

        return new Promise((resolve) => {
            let done = false;
            const finish = () => {
                if (done) return;
                done = true;
                stopRain();
                el.celebrate.hidden = true;
                el.machine.classList.remove('celebrating', 'shake');
                el.celebrate.onclick = null;
                resolve();
            };
            el.celebrate.onclick = finish;
            counting.then(() => setTimeout(finish, opts.hold || (state.auto > 0 || state.free ? 1800 : 3200)));
        });
    }

    function bigWin(win, bet) {
        const t = state.game.winTiers;
        const x = win / bet;
        const ups = [];
        if (x >= t.mega) ups.push({ at: bet * t.mega, title: 'Mega win', tier: 'mega', rain: 1.5 });
        if (x >= t.epic) ups.push({ at: bet * t.epic, title: 'Epic win', tier: 'epic', rain: 2.5 });
        Sound.bigWin();
        return overlay('Big win', win, null, { tier: 'big', rain: 1, upgrades: ups, duration: x >= t.epic ? 7000 : x >= t.mega ? 5200 : 3200 });
    }

    // =========================================================
    // Spin flow
    // =========================================================

    async function spin() {
        if (state.spinning || !state.game) return;
        const bet = currentBet();
        if (!state.free && state.balance < bet) {
            state.auto = 0;
            setMessage('Not enough money for this bet', 'error');
            Sound.error();
            refresh();
            return;
        }

        state.spinning = true;
        clearWins();
        hideBanner();
        clearTimeout(state.idleTimer);
        el.spinBtn.classList.remove('attract');
        el.autoMenu.hidden = true;
        const freeBefore = state.free ? state.free.total : 0;
        if (!state.free) { state.balance -= bet; setMessage('Good luck!'); }
        refresh();
        Sound.spinStart();

        const result = await post('spin', { bet });
        if (!result || result.error || !result.steps) {
            state.spinning = false;
            const err = result && result.error;
            if (err === 'far') return close();
            if (!state.free) state.balance += bet;
            if (err === 'funds') setMessage('Not enough money for this bet', 'error');
            if (err && err !== 'busy') state.auto = 0;
            refresh();
            return;
        }

        const steps = arr(result.steps);
        const mult = result.multiplier || 1;
        let running = 0;

        for (let i = 0; i < steps.length; i++) {
            const step = steps[i];
            if (i === 0) await animateReels(arr(step.grid).map(arr));
            if (state.game.cascade) renderLadder(Math.min(i, arr(state.free ? state.game.cascade.freeLadder : state.game.cascade.ladder).length - 1));
            const wins = arr(step.wins);
            const removed = arr(step.removed);
            const isLast = i === steps.length - 1 || !removed.length;
            if (wins.length) {
                const before = running;
                running += step.win;
                showWins(wins, result.bet, mult * (step.ladder || 1), isLast);
                showBanner(state.free ? 'Total win' : 'Win', freeBefore + running, freeBefore + before);
                Sound.win(step.win / result.bet, i);
                wins.forEach((w) => burstFrom(arr(w.positions), step.win / result.bet));
                if (state.game.cascade && i > 0) setMessage(`Cascade ×${step.ladder}!`, 'hot');
            }
            if (removed.length && i < steps.length - 1) {
                await sleep(fast(950, 480));
                clearInterval(state.cycleTimer);
                removed.forEach(([r, row]) => cellAt(r, row)?.classList.add('pop'));
                Sound.pop(i);
                await sleep(330);
                clearWins();
                await collapseTo(removed, arr(steps[i + 1].grid).map(arr));
            }
        }

        const scat = arr(result.scatterPositions);
        if (scat.length) {
            el.window.classList.add('has-win');
            highlight(scat, '#ffffff');
            burstFrom(scat, 4);
            if (result.scatterWin > 0) {
                running += result.scatterWin;
                showBanner(state.free ? 'Total win' : 'Win', freeBefore + running);
            }
        }

        state.balance = result.balance;
        if (result.freeSpins) state.free = result.freeSpins;

        if (result.win > 0) {
            if (!result.wasFreeSpin) setMessage(result.win >= result.bet ? 'Nice!' : 'Small win', 'hot');
            if (result.win >= result.bet * state.game.winTiers.big) {
                await sleep(500);
                await bigWin(result.win, result.bet);
            } else if (result.win >= result.bet * 3) {
                flash(true);
                FX.fountain(1);
                Sound.niceWin();
            }
        } else if (!result.wasFreeSpin) {
            setMessage('No win this time');
        }

        if (result.jackpotWin) {
            Sound.jackpot();
            await overlay('Jackpot', result.jackpotWin, 'The progressive jackpot is yours', { tier: 'jackpot', rain: 3, shake: true, hold: 6000, duration: 8000 });
        }

        if (result.triggered > 0) {
            Sound.freeSpins();
            const fs = state.game.freeSpins;
            const note = fs.multiplierStep ? `The multiplier climbs every spin, up to ×${fs.maxMultiplier}`
                : state.game.cascade ? `Cascade multipliers start at ×${arr(state.game.cascade.freeLadder)[0]}`
                : `Every win pays ×${fs.multiplier}`;
            await overlay(result.wasFreeSpin ? `+${result.triggered} free spins` : `${result.triggered} free spins`, null, note, { tier: 'mega', rain: 2, shake: true, hold: 2600 });
        }

        if (state.free && state.free.finished) {
            const total = state.free.total;
            state.free = null;
            renderFree();
            await overlay('Free spins paid', total, null, { tier: 'big', rain: total > 0 ? 2 : 0, hold: 3200, duration: Math.min(5000, 1500 + total / 30) });
            showBanner('Free spins paid', total);
            setMessage(`Free spins paid ${money(total)}`, 'hot');
        } else if (state.free) {
            setMessage(`Free spin ${state.free.played} of ${state.free.played + state.free.remaining}`);
        }

        if (!result.wasFreeSpin) {
            state.streak = result.win > 0 ? state.streak + 1 : 0;
            renderStreak();
        }
        if (result.xp) await setXp(result.xp);

        state.spinning = false;
        if (state.auto > 0 && !state.free) state.auto--;
        renderLadder(-1);
        refresh();
        armIdle();
        next();
    }

    async function next() {
        if (!state.open) return;
        if (state.free) {
            await sleep(fast(1300, 600));
            if (state.open && !state.spinning) spin();
        } else if (state.auto > 0) {
            await sleep(fast(800, 300));
            if (state.open && !state.spinning && state.auto > 0) spin();
        }
    }

    function renderStreak() {
        const n = state.streak;
        el.streak.hidden = n < 2;
        if (n >= 2) {
            el.streak.textContent = `🔥 ${n} wins in a row`;
            el.streak.style.animation = 'none'; void el.streak.offsetWidth; el.streak.style.animation = '';
            Sound.streak(n);
        }
    }

    async function setXp(xp) {
        el.level.hidden = false;
        el.levelBadge.textContent = xp.level;
        el.levelFill.style.width = `${Math.min(100, (xp.into / xp.need) * 100)}%`;
        if (xp.levelUp) {
            el.level.classList.add('up');
            setTimeout(() => el.level.classList.remove('up'), 1400);
            Sound.levelUp();
            await overlay(`Level ${xp.level}`, xp.reward > 0 ? xp.reward : null, xp.reward > 0 ? 'Level up bonus' : 'Level up', { tier: 'mega', rain: 2, hold: 2200, duration: 1600 });
        }
    }

    function armIdle() {
        clearTimeout(state.idleTimer);
        el.spinBtn.classList.remove('attract');
        state.idleTimer = setTimeout(() => { if (state.open && !state.spinning) el.spinBtn.classList.add('attract'); }, 5000);
    }

    // =========================================================
    // Bonus buy
    // =========================================================

    function buyBonus() {
        const g = state.game;
        const bet = currentBet();
        const cost = bet * g.bonusBuy.cost;
        const fs = g.freeSpins;
        const extra = fs.multiplierStep ? `with a multiplier that climbs to ×${fs.maxMultiplier}`
            : g.cascade ? `with cascade multipliers from ×${arr(g.cascade.freeLadder)[0]}` : `with every win ×${fs.multiplier}`;
        el.confirmIcon.innerHTML = state.art[g.scatter] || '';
        el.confirmTitle.textContent = 'Buy free spins?';
        el.confirmText.textContent = `${g.bonusBuy.spins} free spins at ${money(bet)} a spin, ${extra}.`;
        el.confirmYes.disabled = state.balance < cost;
        el.confirmYes.textContent = state.balance < cost ? 'Not enough money' : `Buy for ${money(cost)}`;
        el.confirm.hidden = false;
        Sound.click();
    }

    async function confirmBuy() {
        el.confirm.hidden = true;
        if (state.spinning) return;
        state.spinning = true;
        refresh();
        const res = await post('buyBonus', { bet: currentBet() });
        state.spinning = false;
        if (!res || res.error) {
            setMessage(res && res.error === 'funds' ? 'Not enough money for the bonus' : 'Bonus buy is not available right now', 'error');
            refresh();
            return;
        }
        state.balance = res.balance;
        state.free = res.freeSpins;
        if (res.xp) setXp(res.xp);
        clearWins();
        hideBanner();
        refresh();
        Sound.freeSpins();
        const fs = state.game.freeSpins;
        await overlay(`${res.freeSpins.remaining} free spins`, null,
            fs.multiplierStep ? `The multiplier climbs every spin, up to ×${fs.maxMultiplier}` : 'Good luck!', { tier: 'mega', rain: 2, shake: true, hold: 2400 });
        renderLadder(-1);
        next();
    }

    // =========================================================
    // Paytable
    // =========================================================

    function buildPaytable() {
        const g = state.game;
        const bet = currentBet();
        const unit = bet / g.betUnit;
        el.paytableSub.textContent = g.mode === 'ways'
            ? `Prizes for a ${money(bet)} bet, per way. Match symbols on neighbouring reels starting from the left.`
            : `Prizes for a ${money(bet)} bet. Match symbols left to right on any of the ${g.lines.length} lines.`;
        el.paytableGrid.innerHTML = '';
        g.symbols.forEach((s) => {
            const pays = arr(s.pays);
            const row = document.createElement('div');
            row.className = 'pay-row';
            let body;
            if (s.scatter) body = `<span class="pay-name">${s.name}</span><span class="tagline">Free spins symbol, pays anywhere</span>`;
            else if (s.wild && !pays.length) body = `<span class="pay-name">${s.name}</span><span class="tagline">Replaces every symbol${g.scatter ? ' except ' + state.symbols[g.scatter].name : ''}</span>`;
            else body = `<span class="pay-name">${s.name}${s.wild ? ' (wild)' : ''}</span><ul>${[...pays].reverse().map(([c, p]) => `<li><span>${c}×</span>${money(p * unit)}</li>`).join('')}</ul>`;
            row.innerHTML = `<div class="art">${state.art[s.id]}</div><div>${body}</div>`;
            el.paytableGrid.appendChild(row);
        });

        const rules = [];
        rules.push(g.mode === 'ways'
            ? `${Math.pow(g.rows, g.reels).toLocaleString('en-US')} ways to win: a symbol pays when it's on reel 1 and on every reel next to it, in any row.`
            : `Wins pay left to right on ${g.lines.length} lines. Only the best win per line counts.`);
        const wilds = g.symbols.filter((s) => s.wild);
        if (wilds.some((w) => w.badge)) rules.push(`Wilds marked ${wilds.map((w) => w.badge).filter(Boolean).join(', ')} multiply the win, and two of them on a line multiply each other.`);
        if (g.cascade) rules.push(`Cascades: winning symbols explode and new ones fall in. Every cascade in a row raises the multiplier (${arr(g.cascade.ladder).map((v) => '×' + v).join(', ')}).`);
        if (g.freeSpins) {
            const fs = g.freeSpins;
            const sc = state.symbols[g.scatter].name;
            rules.push(`${arr(fs.trigger).map(([c, n]) => `${c} ${sc}`).join(' / ')} give ${arr(fs.trigger).map(([, n]) => n).join(' / ')} free spins, and pay ${arr(fs.scatterPays).map(([, x]) => money(x * bet)).join(' / ')}.`);
            if (fs.multiplierStep) rules.push(`In free spins the multiplier starts at ×${fs.multiplier} and goes up every spin, up to ×${fs.maxMultiplier}.`);
            else if (g.cascade) rules.push(`In free spins cascade multipliers are bigger: ${arr(g.cascade.freeLadder).map((v) => '×' + v).join(', ')}.`);
            else rules.push(`Every free spin win is multiplied by ${fs.multiplier}. Free spins can retrigger.`);
        }
        if (g.bonusBuy) rules.push(`Buy free spins starts the bonus straight away for ${g.bonusBuy.cost}× your bet.`);
        if (g.maxWin) rules.push(`Biggest possible win on one spin: ${g.maxWin.toLocaleString('en-US')}× your bet.`);
        rules.push('The progressive jackpot can drop on any paid spin. Higher bets have better odds.');
        el.rules.innerHTML = rules.map((r) => `<p>${r}</p>`).join('');
    }

    // =========================================================
    // Open / close
    // =========================================================

    function open(data) {
        const g = data.game;
        g.symbols = arr(g.symbols);
        g.betLevels = arr(g.betLevels);
        if (g.lines) g.lines = arr(g.lines).map(arr);
        state.game = g;
        state.symbols = Object.fromEntries(g.symbols.map((s) => [s.id, s]));
        state.art = Object.fromEntries(g.symbols.map((s) => [s.id, window.SlotIcons.render(s)]));
        state.balance = data.balance;
        state.jackpot = data.jackpot || 0;
        state.free = data.freeSpins || null;
        state.auto = 0;
        state.spinning = false;
        state.streak = 0;
        state.betIndex = Math.min(state.betIndex, g.betLevels.length - 1);
        state.open = true;

        applyTheme(g);
        el.title.textContent = g.label;
        el.jackpot.textContent = money(state.jackpot);
        el.buyIcon.innerHTML = g.scatter ? state.art[g.scatter] : '';
        el.app.hidden = false;
        el.autoMenu.hidden = true;
        el.celebrate.hidden = el.paytable.hidden = el.confirm.hidden = true;
        el.streak.hidden = true;
        hideBanner();
        el.level.hidden = !data.xp;
        if (data.xp) { el.levelBadge.textContent = data.xp.level; el.levelFill.style.width = `${(data.xp.into / data.xp.need) * 100}%`; }

        requestAnimationFrame(() => {
            FX.resize();
            buildReels();
            renderLadder(-1);
            refresh();
            armIdle();
            if (state.free) { setMessage('Finishing your free spins'); setTimeout(next, 900); }
            else setMessage(g.mode === 'ways' ? 'Match symbols on neighbouring reels' : 'Pick your bet and spin');
        });
    }

    function close() {
        state.open = false;
        state.auto = 0;
        state.spinning = false;
        clearWins();
        Sound.spinStop();
        el.app.hidden = true;
        post('close');
    }

    function setJackpot(v) {
        if (!v || v === state.jackpot) return;
        state.jackpot = v;
        el.jackpot.textContent = money(v);
        el.jackpot.classList.remove('bump'); void el.jackpot.offsetWidth; el.jackpot.classList.add('bump');
    }

    // =========================================================
    // Particles
    // =========================================================

    const FX = (() => {
        const ctx = el.fx.getContext('2d');
        let parts = [], running = false, w = 0, h = 0;
        const raining = new Set();
        const CONFETTI = ['#ff4d6d', '#ffd23f', '#3fe08a', '#22e6ff', '#b679ff', '#ffffff'];

        function resize() {
            const r = el.machine.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            w = r.width; h = r.height;
            el.fx.width = w * dpr; el.fx.height = h * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        function add(p) { if (parts.length > 450) return; parts.push(p); if (!running) { running = true; requestAnimationFrame(loop); } }
        const theme = () => { const c = getComputedStyle(el.machine); return [c.getPropertyValue('--primary').trim(), c.getPropertyValue('--secondary').trim(), '#ffffff']; };

        function burst(x, y, n, kind) {
            const colors = theme();
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 6;
                add({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, life: 1, decay: 0.012 + Math.random() * 0.015, kind,
                    size: kind === 'coin' ? 7 + Math.random() * 6 : 2 + Math.random() * 3, spin: Math.random() * 6, spinV: 0.15 + Math.random() * 0.25, color: colors[i % 3] });
            }
            for (let i = 0; i < 5; i++) add({ x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 3, life: 1, decay: 0.03, kind: 'star', size: 6 + Math.random() * 6, spin: Math.random() * 6, spinV: 0.1, color: '#fff' });
        }
        function ring(x, y) { add({ x, y, vx: 0, vy: 0, life: 1, decay: 0.035, kind: 'ring', size: 10, grow: 4, color: theme()[0] }); }
        function fountain(intensity = 1) {
            for (let i = 0; i < Math.floor(18 * intensity); i++) {
                const confetti = Math.random() < 0.45;
                add({ x: w * (0.25 + Math.random() * 0.5), y: h + 10, vx: (Math.random() - 0.5) * 9, vy: -(12 + Math.random() * 10), life: 1, decay: 0.006 + Math.random() * 0.006,
                    kind: confetti ? 'confetti' : 'coin', size: confetti ? 5 + Math.random() * 5 : 8 + Math.random() * 7, spin: Math.random() * 6, spinV: 0.1 + Math.random() * 0.3, color: CONFETTI[i % CONFETTI.length] });
            }
        }
        function rain(intensity) {
            const token = {};
            raining.add(token);
            const drop = () => {
                if (!raining.has(token)) return;
                for (let i = 0; i < intensity * 2; i++) {
                    const confetti = Math.random() < 0.35;
                    add({ x: Math.random() * w, y: -20, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 4, life: 1, decay: 0.004,
                        kind: confetti ? 'confetti' : 'coin', size: confetti ? 5 + Math.random() * 5 : 8 + Math.random() * 8, spin: Math.random() * 6, spinV: 0.1 + Math.random() * 0.25,
                        color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)] });
                }
                setTimeout(drop, 55);
            };
            drop();
            return () => raining.delete(token);
        }
        function coin(p) {
            const sx = Math.abs(Math.cos(p.spin));
            ctx.save(); ctx.translate(p.x, p.y); ctx.scale(Math.max(0.15, sx), 1);
            const g = ctx.createRadialGradient(-p.size * 0.3, -p.size * 0.3, 1, 0, 0, p.size);
            g.addColorStop(0, '#fff6c9'); g.addColorStop(0.45, '#ffd23f'); g.addColorStop(1, '#a66e00');
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.size, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = 'rgba(120,70,0,0.8)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.68, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }
        function starShape(p) {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin);
            ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.beginPath();
            for (let i = 0; i < 8; i++) { const r = i % 2 ? p.size * 0.25 : p.size, a = (i / 8) * Math.PI * 2; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
            ctx.closePath(); ctx.fill(); ctx.restore();
        }
        function loop() {
            ctx.clearRect(0, 0, w, h);
            parts = parts.filter((p) => p.life > 0 && p.y < h + 60);
            for (const p of parts) {
                p.vy += p.kind === 'coin' ? 0.32 : p.kind === 'confetti' ? 0.18 : p.kind === 'ring' ? 0 : 0.12;
                if (p.kind === 'confetti') { p.vx *= 0.98; p.vy = Math.min(p.vy, 3.5); }
                p.x += p.vx; p.y += p.vy; p.spin += p.spinV || 0; p.life -= p.decay;
                ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
                if (p.kind === 'coin') coin(p);
                else if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.scale(1, Math.cos(p.spin * 1.7)); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
                else if (p.kind === 'ring') { p.size += p.grow; ctx.strokeStyle = p.color; ctx.lineWidth = 4 * p.life; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.stroke(); }
                else if (p.kind === 'star') starShape(p);
                else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.globalAlpha = 1;
            if (parts.length || raining.size) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0, 0, w, h); }
        }
        return { resize, burst, ring, fountain, rain };
    })();

    // =========================================================
    // Sound: soft, round synth sounds (no harsh square waves), no files needed
    // =========================================================

    const Sound = (() => {
        let ctx, master, verb, spinNode = null;
        const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12);

        function unlock() {
            if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
            try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
            const comp = ctx.createDynamicsCompressor();
            comp.threshold.value = -16; comp.ratio.value = 3;
            master = ctx.createGain(); master.gain.value = 0.5;
            master.connect(comp).connect(ctx.destination);
            verb = ctx.createConvolver();
            const len = ctx.sampleRate * 1.4, buf = ctx.createBuffer(2, len, ctx.sampleRate);
            for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
            verb.buffer = buf;
            const vg = ctx.createGain(); vg.gain.value = 0.22;
            verb.connect(vg).connect(master);
        }
        const ok = () => ctx && !state.muted;
        const now = () => ctx.currentTime;

        // a soft bell-like note: sine + quiet octave, gentle attack
        function bell(freq, start = 0, dur = 0.5, vol = 0.07, wet = 0.5) {
            if (!ok()) return;
            const t = now() + start;
            [[1, vol], [2, vol * 0.25], [3, vol * 0.08]].forEach(([m, v]) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.type = 'sine'; o.frequency.value = freq * m;
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(v, t + 0.008);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur / m);
                o.connect(g); g.connect(master);
                if (wet) { const s = ctx.createGain(); s.gain.value = wet; g.connect(s).connect(verb); }
                o.start(t); o.stop(t + dur + 0.05);
            });
        }
        function tone(freq, start, dur, { type = 'triangle', vol = 0.06, slide = 0, attack = 0.01, wet = 0.3 } = {}) {
            if (!ok()) return;
            const t = now() + start;
            const o = ctx.createOscillator(), g = ctx.createGain();
            o.type = type; o.frequency.setValueAtTime(freq, t);
            if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol, t + attack);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(master);
            if (wet) { const s = ctx.createGain(); s.gain.value = wet; g.connect(s).connect(verb); }
            o.start(t); o.stop(t + dur + 0.05);
        }
        function noise(start, dur, { vol = 0.08, freq = 1200, q = 1, type = 'bandpass', slideTo = 0 } = {}) {
            if (!ok()) return;
            const t = now() + start;
            const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
            const buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
            const src = ctx.createBufferSource(); src.buffer = buf;
            const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
            if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(f).connect(g).connect(master);
            src.start(t); src.stop(t + dur);
        }
        const kick = (start = 0, vol = 0.4) => tone(140, start, 0.3, { type: 'sine', vol, slide: 0.3, wet: 0 });
        const shimmer = (start = 0) => noise(start, 0.6, { vol: 0.05, freq: 6000, q: 0.8, type: 'highpass' });
        const chord = (notes, start, dur, vol = 0.05) => notes.forEach((n) => bell(NOTE(n), start, dur, vol, 0.6));
        const arp = (notes, start, gap, dur = 0.5, vol = 0.07) => notes.forEach((n, i) => bell(NOTE(n), start + i * gap, dur, vol));

        return {
            unlock,
            click: () => tone(1200, 0, 0.05, { type: 'sine', vol: 0.04, wet: 0 }),
            error: () => { tone(220, 0, 0.18, { type: 'triangle', vol: 0.06 }); tone(180, 0.12, 0.22, { type: 'triangle', vol: 0.06 }); },
            spinStart: () => { unlock(); noise(0, 0.3, { vol: 0.05, freq: 500, slideTo: 2500, q: 0.7 }); tone(330, 0, 0.12, { type: 'sine', vol: 0.05, slide: 1.5 }); },
            // a soft rolling whoosh with gentle clicks, like a well-oiled reel
            spinLoop: () => {
                if (!ok() || spinNode) return;
                const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
                for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
                const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
                const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, now()); g.gain.exponentialRampToValueAtTime(0.035, now() + 0.15);
                src.connect(f).connect(g).connect(master); src.start();
                const ticker = setInterval(() => tone(1800, 0, 0.025, { type: 'sine', vol: 0.012, wet: 0 }), 80);
                spinNode = { src, g, ticker };
            },
            spinStop: () => {
                if (!spinNode) return;
                const { src, g, ticker } = spinNode;
                clearInterval(ticker);
                if (ctx) { g.gain.setTargetAtTime(0.0001, now(), 0.06); src.stop(now() + 0.4); }
                spinNode = null;
            },
            reelStop: (i) => { kick(0, 0.22); tone(520 + i * 40, 0, 0.06, { type: 'sine', vol: 0.03, wet: 0.1 }); },
            thud: () => kick(0, 0.25),
            riser: (secs) => { tone(220, 0, secs, { type: 'sine', vol: 0.05, slide: 4, attack: secs * 0.85, wet: 0.5 }); noise(0, secs, { vol: 0.04, freq: 400, slideTo: 5000, q: 1.5 }); },
            scatter: (n) => { const base = 76 + n * 3; [0, 4, 7, 12].forEach((iv, i) => bell(NOTE(base + iv), i * 0.05, 0.9, 0.07, 0.7)); },
            lineHit: (i) => bell(NOTE(79 + (i % 6) * 2), 0, 0.35, 0.045, 0.4),
            pop: (chain = 0) => { tone(NOTE(72 + chain * 3), 0, 0.15, { type: 'sine', vol: 0.09, slide: 1.8 }); noise(0, 0.1, { vol: 0.05, freq: 3000 }); },
            win: (x, chain = 0) => {
                const u = chain * 2;
                if (x < 1) arp([72 + u, 76 + u, 79 + u], 0, 0.07, 0.5, 0.05);
                else if (x < 5) { arp([72 + u, 76 + u, 79 + u, 84 + u], 0, 0.08, 0.6, 0.06); kick(0, 0.25); }
                else { arp([72 + u, 76 + u, 79 + u, 84 + u, 88 + u, 91 + u], 0, 0.07, 0.7, 0.06); kick(0, 0.3); shimmer(0.2); }
            },
            niceWin: () => { chord([60, 64, 67, 72], 0, 1.2); arp([84, 88, 91, 96], 0.1, 0.08, 0.6); kick(0); shimmer(0.1); },
            bigWin: () => {
                for (let i = 0; i < 8; i++) noise(i * 0.05, 0.08, { vol: 0.08, freq: 2200, q: 0.8 });
                kick(0.42, 0.5);
                chord([48, 60, 64, 67, 72], 0.42, 2, 0.045);
                arp([72, 76, 79, 84, 88, 91], 0.5, 0.1, 0.8);
                shimmer(0.45);
            },
            tierUp: (tier) => {
                const r = tier === 'epic' ? 53 : 50;
                noise(0, 0.45, { vol: 0.08, freq: 300, slideTo: 7000, q: 1 });
                kick(0.1, 0.55);
                chord([r, r + 12, r + 16, r + 19, r + 24], 0.1, 1.8, 0.045);
                arp([r + 24, r + 28, r + 31, r + 36], 0.15, 0.08, 0.7);
                shimmer(0.15);
            },
            landing: () => { kick(0, 0.4); chord([60, 64, 67, 72, 76], 0, 2, 0.04); },
            freeSpins: () => { arp([84, 88, 91, 96, 100, 103, 108], 0, 0.06, 1, 0.06); kick(0, 0.3); chord([55, 67, 71, 74], 0.42, 1.6); shimmer(0.4); },
            jackpot: () => {
                for (let r = 0; r < 3; r++) { kick(r * 0.5, 0.5); chord([48 + r * 2, 60 + r * 2, 64 + r * 2, 67 + r * 2], r * 0.5, 0.8); }
                arp([72, 76, 79, 84, 88, 91, 96, 100], 1.5, 0.08, 1); shimmer(1.5);
            },
            streak: (n) => bell(NOTE(76 + Math.min(n, 10) * 2), 0, 0.5, 0.05),
            levelUp: () => { arp([67, 72, 76, 79, 84], 0, 0.08, 0.7); kick(0.32, 0.3); },
        };
    })();

    // =========================================================
    // Input
    // =========================================================

    window.addEventListener('message', (e) => {
        const msg = e.data || {};
        if (msg.action === 'open') open(msg.data);
        else if (msg.action === 'close') { state.open = false; el.app.hidden = true; Sound.spinStop(); }
        else if (msg.action === 'jackpot') setJackpot(msg.value);
    });

    el.spinBtn.onclick = () => {
        Sound.unlock();
        if (state.auto > 0 && !state.free) { state.auto = 0; refresh(); return; }
        spin();
    };
    el.betDown.onclick = () => { Sound.unlock(); Sound.click(); state.betIndex = Math.max(0, state.betIndex - 1); refresh(); armIdle(); };
    el.betUp.onclick = () => { Sound.unlock(); Sound.click(); state.betIndex = Math.min(state.game.betLevels.length - 1, state.betIndex + 1); refresh(); armIdle(); };
    el.turboBtn.onclick = () => { Sound.unlock(); Sound.click(); state.turbo = !state.turbo; el.turboBtn.setAttribute('aria-pressed', state.turbo); };
    el.muteBtn.onclick = () => { state.muted = !state.muted; el.muteBtn.setAttribute('aria-pressed', state.muted); if (state.muted) Sound.spinStop(); };
    el.autoBtn.onclick = () => {
        Sound.unlock(); Sound.click();
        if (state.auto > 0) { state.auto = 0; refresh(); return; }
        el.autoMenu.hidden = !el.autoMenu.hidden;
    };
    el.autoMenu.querySelectorAll('button').forEach((b) => {
        b.onclick = () => { state.auto = parseInt(b.dataset.auto, 10); el.autoMenu.hidden = true; refresh(); spin(); };
    });
    el.bonusBtn.onclick = () => { Sound.unlock(); buyBonus(); };
    el.confirmYes.onclick = confirmBuy;
    el.paytableBtn.onclick = () => { Sound.unlock(); Sound.click(); buildPaytable(); el.paytable.hidden = false; };
    document.querySelectorAll('[data-close]').forEach((b) => { b.onclick = () => { $(b.dataset.close).hidden = true; }; });
    $('closeBtn').onclick = close;

    document.addEventListener('keydown', (e) => {
        if (!state.open) return;
        if (e.key === 'Escape') {
            if (!el.paytable.hidden || !el.confirm.hidden) { el.paytable.hidden = el.confirm.hidden = true; return; }
            close();
        } else if (e.code === 'Space') {
            e.preventDefault();
            if (!el.celebrate.hidden) { el.celebrate.click(); return; }
            if (el.paytable.hidden && el.confirm.hidden) el.spinBtn.click();
        }
    });

    window.addEventListener('resize', () => { if (state.open && !state.spinning) { FX.resize(); clearWins(); buildReels(state.grid); } });

    if (!inGame && window.SlotPreview) {
        document.body.style.background = 'radial-gradient(circle at 50% 30%, #3a3f47, #15171a)';
        window.SlotPreview.onReopen = open;
        open(window.SlotPreview.open());
    }
})();

</script>
</body>
</html>
